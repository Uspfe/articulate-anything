[project]
authors = [{name = "Uspfe", email = "benjamin.bogenberger@tum.de"}]
dependencies = []
name = "articulate-anything"
requires-python = "== 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
articulate_anything = { path = ".", editable = true }
google-generativeai = "*"
clip = { git = "https://github.com/openai/CLIP.git" }
cotracker = { git = "https://github.com/facebookresearch/co-tracker.git", rev =  "5951295e0ac49068824f75a497ae6749379ec62b" }
ipykernel = "*"
matplotlib = "*"
markdown2 = "*"
scikit-learn = "*"
opencv-python = "*"
sapien = "==2.2.2"
pybullet = "*"
numpy= "*" # =1.26.4',  # pybullet requires numpy = 
seaborn = "*"
trimesh = "*"
rich = "*"
GPUtil = "*"
hydra-core = "*"
termcolor = "*"
python-dotenv = "*"
plotly = "*"
nbformat = "*"
astor = "*"
gradio = "*"
openai = "*"
anthropic = "*"
moviepy = "*"

[tool.pixi.tasks]

[tool.pixi.system-requirements]
cuda = "12" 